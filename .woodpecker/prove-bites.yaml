# A workflow that upstream's linter ACCEPTS and this gate refuses, pushed once to prove the shared plugin
# bites in an ordinary repository rather than only in home-ops. Reverted in the next commit.
#
# Both mistakes are invisible to `woodpecker lint`: the schema allows the keys, so the pipeline goes green
# while the backend quietly does the wrong thing.
steps:
  # 1. `nodeselector` is not a key the kubernetes backend decodes (mapstructure drops unknown fields), so
  #    this step is *not* pinned anywhere and the green check mark is a lie about where it ran.
  - name: pretend-to-be-pinned
    image: docker.io/library/alpine:3.22
    commands:
      - echo this pod landed on whatever node the scheduler liked
    backend_options:
      kubernetes:
        nodeselector:
          kubernetes.io/os: linux

  # 2. `commands` together with `entrypoint`: pod.go:267-281 puts the generated script in `command` and
  #    then overwrites it with the entrypoint without ever setting args, so nothing here runs and the
  #    container dies with `/bin/sh: -c requires an argument` (the docker backend passes commands as
  #    args, which is why `woodpecker-cli exec` calls this file fine).
  - name: runs-nothing
    image: docker.io/library/alpine:3.22
    entrypoint:
      - /bin/sh
      - -c
    commands:
      - echo you will never see me
